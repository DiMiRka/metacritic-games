x-app: &app
  build: .
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true

# .env общий только для подстановки ${...}. В контейнер попадают лишь перечисленные переменные:
# ключи LLM и YouTube есть только у воркера, пароли ролей только у migrate.
# Переменная без значения берётся из .env, если она там задана, иначе остаётся умолчание кода
x-common-env: &common-env
  ENV:
  TIMEZONE:
  LOG_FORMAT: ${LOG_FORMAT:-json}
  LOG_LEVEL:
  SENTRY_DSN:
  SENTRY_TRACES_SAMPLE_RATE:

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Владелец схемы нужен только здесь: миграции, роли app_web и app_worker и функции очереди
  migrate:
    <<: *app
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_WEB_DB_PASSWORD:
      APP_WORKER_DB_PASSWORD:
      # Подставляются в функции базы при python -m app db-roles
      JOB_MAX_ATTEMPTS:
      MANUAL_RUN_COOLDOWN_MINUTES:
      LOGIN_WINDOW_MINUTES:
    command: ["sh", "-c", "alembic upgrade head && python -m app db-roles"]
    restart: "no"
    networks: [backend]
    mem_limit: 512m
    cpus: 0.5
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://app_web:${APP_WEB_DB_PASSWORD:?задайте APP_WEB_DB_PASSWORD в .env}@db:5432/${POSTGRES_DB}
      MANUAL_RUN_COOLDOWN_MINUTES:
      SESSION_TTL_HOURS:
      LOGIN_MAX_ATTEMPTS:
      LOGIN_WINDOW_MINUTES:
      LOGIN_DELAY_AFTER:
      LOGIN_DELAY_MAX_SECONDS:
      LOGIN_ALERT_THRESHOLD:
      ADMIN_TOTP_REQUIRED:
      RATE_LIMIT_CATALOG_PER_MINUTE:
      RATE_LIMIT_API_PER_MINUTE:
      RATE_LIMIT_LOGIN_PER_MINUTE:
      LLM_PRICE_INPUT_PER_MTOK:
      LLM_PRICE_OUTPUT_PER_MTOK:
    networks: [backend, frontend]
    mem_limit: 512m
    cpus: 1.0
    # /health отвечает 200, только если база доступна
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["python", "-m", "app", "worker"]
    # Больше WORKER_SHUTDOWN_GRACE_SECONDS: воркер успевает доделать задачи и вернуть остальные
    stop_grace_period: 45s
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://app_worker:${APP_WORKER_DB_PASSWORD:?задайте APP_WORKER_DB_PASSWORD в .env}@db:5432/${POSTGRES_DB}
      CRAWL_ON_START: ${CRAWL_ON_START:-true}
      HF_HOME: /srv/data/models/hf
      # Воркер обновляет файл после каждого удачного heartbeat в базу
      WORKER_HEALTH_FILE: /tmp/worker-alive
      # Метрики процесса воркера, порт открыт только во внутренней сети backend
      WORKER_METRICS_PORT: ${WORKER_METRICS_PORT:-9100}
      BATCH_SIZE:
      CRAWL_INTERVAL_MINUTES:
      MANUAL_RUN_COOLDOWN_MINUTES:
      RETENTION_DAYS:
      RAW_RETENTION_DAYS:
      CLEANUP_HOUR:
      WORKER_ID:
      JOB_LEASE_SECONDS:
      JOB_MAX_ATTEMPTS:
      JOB_POLL_SECONDS:
      JOB_RETRY_BASE_SECONDS:
      JOB_RETRY_MAX_SECONDS:
      SCRAPE_CONCURRENCY:
      CONCURRENCY:
      SUMMARY_CONCURRENCY:
      EMBED_CONCURRENCY:
      LETSPLAY_CONCURRENCY:
      WORKER_SHUTDOWN_GRACE_SECONDS:
      BREAKER_METACRITIC_THRESHOLD:
      BREAKER_METACRITIC_OPEN_SECONDS:
      BREAKER_LLM_THRESHOLD:
      BREAKER_LLM_OPEN_SECONDS:
      BREAKER_PROBE_SECONDS:
      REQUEST_DELAY:
      USER_AGENT:
      LLM_PROVIDER:
      SUMMARY_MODEL:
      ANTHROPIC_API_KEY:
      LLM_API_KEY:
      LLM_BASE_URL:
      YOUTUBE_API_KEY:
      EMBEDDING_MODEL:
      EMBEDDING_CACHE_DIR:
    volumes:
      - models:/srv/data/models
    # Воркеру нужен интернет: Metacritic, LLM, YouTube
    networks: [backend, egress]
    # Запас под расшифровку речи faster-whisper
    mem_limit: 3g
    cpus: 1.5
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/worker-alive') > 60)"]
      interval: 20s
      timeout: 5s
      start_period: 60s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Метрики и тревоги. Интерфейсы открыты только на 127.0.0.1 сервера: ssh -L 9090:localhost:9090
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    # backend: опрос web и worker, ops: Alertmanager и порт для туннеля
    networks: [backend, ops]
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    restart: unless-stopped
    depends_on:
      - web
      - worker

  alertmanager:
    image: prom/alertmanager:v0.28.1
    entrypoint: ["sh", "/etc/alertmanager/entrypoint.sh"]
    # Токен и чат только здесь: ни web, ни worker их не видят
    environment:
      TELEGRAM_BOT_TOKEN:
      TELEGRAM_CHAT_ID:
    volumes:
      - ./monitoring/alertmanager-entrypoint.sh:/etc/alertmanager/entrypoint.sh:ro
      - alertmanager_data:/alertmanager
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:9093:9093"
    # ops не internal: Alertmanager ходит в api.telegram.org
    networks: [ops]
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    restart: unless-stopped

  caddy:
    image: caddy:2
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ENV: ${ENV:-dev}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # frontend закрыт от интернета, а egress нужен для портов и выпуска сертификата
    networks: [frontend, egress]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 256m
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

networks:
  # db, web и worker; без выхода наружу
  backend:
    internal: true
  # только web и caddy: до web можно достучаться лишь через Caddy
  frontend:
    internal: true
  egress: {}
  # Prometheus и Alertmanager
  ops: {}

volumes:
  pgdata:
  models:
  caddy_data:
  caddy_config:
  prometheus_data:
  alertmanager_data:
