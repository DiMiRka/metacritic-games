# Настройки поиска секретов Trivy в образах (CI, задание images)
allow-rules:
  # Сторонние пакеты: в их коде и документации встречаются примеры вроде
  # {"type": "service_account"} в SDK Anthropic, это не наши ключи. Уязвимости в этих
  # пакетах Trivy проверяет как обычно, правило касается только поиска секретов.
  # Наш код (/srv/app, migrations) и всё прочее в образе проверяются полностью
  - id: third-party-python-packages
    description: Сторонние Python-пакеты в виртуальном окружении образа
    path: opt/venv/lib/python3\.12/site-packages/
