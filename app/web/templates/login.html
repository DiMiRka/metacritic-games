{% extends "base.html" %}

{% block title %}Вход — Игры Metacritic{% endblock %}

{% block content %}
<div class="login">
  <h1>Вход</h1>
  <p class="muted">Служебная часть сайта: мониторинг и запуск обхода</p>
  {% if error %}<p class="login__error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="login__form">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Логин <input name="login" autocomplete="username" required maxlength="100" autofocus></label>
    <label>Пароль <input name="password" type="password" autocomplete="current-password" required></label>
    <label>Код из приложения <span class="muted small">если включён второй фактор</span>
      <input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="10" pattern="[0-9 ]*"></label>
    <button class="button" type="submit">Войти</button>
  </form>
</div>
{% endblock %}
