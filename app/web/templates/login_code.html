{% extends "base.html" %}

{% block title %}Код входа — Игры Metacritic{% endblock %}

{% block content %}
<div class="login">
  <h1>Код входа</h1>
  <p class="muted">Введите 6 цифр из приложения-аутентификатора или один из резервных кодов вида abcd-efgh-ijkl</p>
  {% if error %}<p class="login__error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login/code" class="login__form">
    <label>Код <input name="code" autocomplete="one-time-code" maxlength="40" required autofocus autocapitalize="off" spellcheck="false"></label>
    <button class="button" type="submit">Войти</button>
  </form>
  <p class="muted small"><a href="/login">Войти заново</a></p>
</div>
{% endblock %}
