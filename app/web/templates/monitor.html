{% extends "base.html" %}

{% block title %}Мониторинг — Игры Metacritic{% endblock %}

{% block scripts %}
  <script src="{{ url_for('static', path='monitor.js') }}" defer></script>
{% endblock %}

{% block content %}
<div class="monitor-head">
  <h1>Мониторинг</h1>
  <div class="monitor-actions">
    <span id="live" class="live" role="status">онлайн</span>
    <button id="run-now" class="button" type="button">Запустить сейчас</button>
  </div>
</div>
<p id="run-message" class="run-message" role="status"></p>

<div id="monitor"
     data-stream-url="/monitor/stream"
     data-run-url="/api/v1/runs"
     data-login-url="/login?next=/monitor"
     data-interval-ms="{{ interval_ms }}">
  {% include "_monitor.html" %}
</div>
{% endblock %}
