name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Раз в неделю: контракт с живым API Metacritic и свежие уязвимости в зависимостях
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.12.6"
  DATABASE_URL: postgresql+asyncpg://metacritic:metacritic@localhost:5432/metacritic

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: metacritic
          POSTGRES_PASSWORD: metacritic
          POSTGRES_DB: metacritic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metacritic"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
      - run: uv run alembic downgrade base
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run python -m app db-roles
        env:
          APP_WEB_DB_PASSWORD: ci-web
          APP_WORKER_DB_PASSWORD: ci-worker
      - run: uv run pytest -q

  e2e:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: metacritic
          POSTGRES_PASSWORD: metacritic
          POSTGRES_DB: metacritic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metacritic"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -m e2e -q

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv export --frozen --all-extras --no-emit-project -o requirements.txt
      - run: uvx pip-audit --requirement requirements.txt --require-hashes --disable-pip

  contract:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run pytest -m live -q
        env:
          RUN_LIVE: "1"

  images:
    needs: [test, audit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [web, worker, offsite]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Имя образа
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE=ghcr.io/${owner}/metacritic-games-${{ matrix.target }}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          load: true
          tags: ${{ env.IMAGE }}:ci
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      # Сборка падает на HIGH и CRITICAL, для которых уже есть исправленная версия
      # Закреплено по коммиту: тег можно перевесить, SHA нет. Dependabot обновляет оба
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
        env:
          # Поиск секретов без сторонних пакетов: в их документации ложные срабатывания
          TRIVY_SECRET_CONFIG: trivy-secret.yaml
      - if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
