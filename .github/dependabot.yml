version: 2
updates:
  # Python: uv.lock
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # yt-dlp обновляется каждый день отдельным workflow (.github/workflows/yt-dlp.yml)
    ignore:
      - dependency-name: yt-dlp
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]

  # Базовые образы в Dockerfile
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # Postgres, Caddy, Prometheus, Alertmanager, rclone в docker-compose.yml
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
